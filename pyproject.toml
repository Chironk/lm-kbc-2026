[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-kbc-2026"
version = "1.0.0"
description = "Heterogeneous parametric-memory system for LM-KBC 2026"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Dylan Luke Holyoak", email = "dholyoa40@geffenacademy.ucla.edu"},
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lm_kbc*"]
